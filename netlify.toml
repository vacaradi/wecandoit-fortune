# Netlify 배포 설정
# GitHub에 push 하면 이 설정대로 자동 빌드·배포된다.

[build]
  # dist 폴더를 만드는 스크립트 (Node — 빌드 서버에 항상 있다)
  command = "node scripts/build-deploy.mjs"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# 영상·이미지는 오래 캐시하고, HTML 과 콘텐츠는 항상 새로 받게 한다
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# 루트 주소와 index.html 은 절대 캐시하지 않는다.
# 이게 없으면 고쳐도 예전 화면이 계속 보인다.
[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-store, must-revalidate"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-store, must-revalidate"

[[headers]]
  for = "/content/*"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
